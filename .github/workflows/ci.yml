name: CI/CD Pipeline — PetCare Planner

on:
  push:
    branches: [ "Taskes", "main" ]
  pull_request:
    branches: [ "Taskes", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install Root Dependencies
        run: npm install

      - name: Install Client & Server Dependencies
        run: |
          npm --prefix client install --include=dev
          npm --prefix server install

      - name: Build Frontend Application
        run: npm --prefix client run build

      - name: Run Backend Integration Tests
        run: node server/test-integration.js
        env:
          PORT: 5005
          NODE_ENV: test
          JWT_SECRET: ci_jwt_secret_test_key_2026
